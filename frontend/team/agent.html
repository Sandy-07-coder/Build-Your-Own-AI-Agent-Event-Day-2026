<!DOCTYPE html>
<html>
<head>
<title>Submit Agent</title>
<link rel="stylesheet" href="/shared/style.css">
</head>

<body>

<nav>

<strong>Team Console</strong>

<div>
<a href="/team/dashboard.html">
Dashboard
</a>

<a href="/team/submissions.html">
Submissions
</a>

</div>

</nav>

<main>

<div class="card">

<h1>Build Your Own AI Agent</h1>

<p>
Submit your final n8n agent.
</p>

<label>Agent Name</label>
<input id="agent">

<label>Problem</label>
<textarea id="problem"></textarea>

<label>Agent Description</label>
<textarea id="description"></textarea>

<label>Webhook URL</label>
<input
id="webhook"
placeholder="https://..."
>

<label>Tools Used</label>
<input
id="tools"
placeholder="Google Search, Calculator..."
>

<label>n8n Workflow JSON</label>
<textarea
id="workflow"
placeholder="Paste exported workflow JSON"
></textarea>

<button onclick="submitAgent()">
Submit Agent
</button>

<p id="message"></p>

</div>

</main>

<script>

async function submitAgent(){

    const payload = {

        agent_name:
        document.getElementById(
            "agent"
        ).value,

        problem:
        document.getElementById(
            "problem"
        ).value,

        description:
        document.getElementById(
            "description"
        ).value,

        webhook_url:
        document.getElementById(
            "webhook"
        ).value,

        tools:
        document.getElementById(
            "tools"
        ).value,

        workflow_json:
        document.getElementById(
            "workflow"
        ).value
    };

    const response =
        await fetch(
            "/api/submissions",
            {
                method:"POST",
                headers:{
                    "Content-Type":
                    "application/json"
                },
                body:JSON.stringify(
                    payload
                )
            }
        );

    const data =
        await response.json();

    document.getElementById(
        "message"
    ).textContent =
        data.success
        ? "Submission successful."
        : data.error;
}

</script>

</body>
</html>
