<!DOCTYPE html>
<html>
<head>
<title>Team Login</title>
<link rel="stylesheet" href="/shared/style.css">
</head>

<body>

<div class="auth">

<h1>🤖 Build Your Own AI Agent</h1>

<p>Team Console</p>

<input id="username" placeholder="Team username">
<input id="password" type="password" placeholder="Password">

<button onclick="login()">Login</button>

<p id="error"></p>

</div>

<script>

async function login(){

    const response = await fetch(
        "/api/auth/team-login",
        {
            method:"POST",
            headers:{
                "Content-Type":
                "application/json"
            },
            body:JSON.stringify({
                username:
                document.getElementById(
                    "username"
                ).value,

                password:
                document.getElementById(
                    "password"
                ).value
            })
        }
    );

    const data = await response.json();

    if(data.success){
        location.href =
            "/team/dashboard.html";
    }else{
        document.getElementById(
            "error"
        ).textContent =
            data.error;
    }
}

</script>

</body>
</html>
