<!DOCTYPE html>
<html>
<head>
<title>Submissions</title>
<link rel="stylesheet" href="/shared/style.css">
</head>

<body>

<nav>

<strong>Team Console</strong>

<div>
<a href="/team/dashboard.html">
Dashboard
</a>

<a href="/team/agent.html">
Submit
</a>
</div>

</nav>

<main>

<h1>My Submissions</h1>

<div id="list"></div>

</main>

<script>

async function load(){

    const data =
        await fetch(
            "/api/submissions/mine"
        ).then(r=>r.json());

    const list =
        document.getElementById(
            "list"
        );

    list.innerHTML = "";

    data.forEach(
        x => {

            list.innerHTML += `
            <div class="card">

            <h2>
            ${x.agent_name}
            </h2>

            <p>
            Status: ${x.status}
            </p>

            <p>
            Submitted:
            ${x.created_at}
            </p>

            <h2>
            Score:
            ${
                x.final_score === null
                ? "--"
                : x.final_score + " / 100"
            }
            </h2>

            </div>
            `;

        }
    );
}

load();

</script>

</body>
</html>
