<!DOCTYPE html>
<html>
<head>
<title>Teams</title>
<link rel="stylesheet" href="/shared/style.css">
</head>

<body>

<nav>

<strong>ADMIN</strong>

<div>
<a href="/admin/dashboard.html">
Dashboard
</a>
<a href="/admin/submissions.html">
Submissions
</a>
</div>

</nav>

<main>

<div class="card">

<h1>Create Team</h1>

<input
id="team"
placeholder="Team Name"
>

<input
id="username"
placeholder="Team Username"
>

<input
id="password"
placeholder="Team Password"
>

<input
id="members"
placeholder="Members separated by comma"
>

<button onclick="createTeam()">
Create Team
</button>

<p id="message"></p>

</div>

<div class="card">

<h1>Teams</h1>

<table>

<thead>

<tr>
<th>ID</th>
<th>Team</th>
<th>Username</th>
<th>Members</th>
<th>Status</th>
</tr>

</thead>

<tbody id="teams"></tbody>

</table>

</div>

</main>

<script>

async function createTeam(){

    const response =
        await fetch(
            "/api/admin/teams",
            {
                method:"POST",
                headers:{
                    "Content-Type":
                    "application/json"
                },
                body:JSON.stringify({

                    team_name:
                    document.getElementById(
                        "team"
                    ).value,

                    username:
                    document.getElementById(
                        "username"
                    ).value,

                    password:
                    document.getElementById(
                        "password"
                    ).value,

                    members:
                    document.getElementById(
                        "members"
                    ).value
                    .split(",")
                    .map(x=>x.trim())

                })
            }
        );

    const data =
        await response.json();

    document.getElementById(
        "message"
    ).textContent =
        data.success
        ? "Team created."
        : data.error;

    load();
}


async function load(){

    const data =
        await fetch(
            "/api/admin/teams"
        ).then(r=>r.json());

    const tbody =
        document.getElementById(
            "teams"
        );

    tbody.innerHTML = "";

    data.forEach(
        x => {

            tbody.innerHTML += `
            <tr>

            <td>${x.id}</td>

            <td>${x.team_name}</td>

            <td>${x.username}</td>

            <td>${x.members}</td>

            <td>
            ${x.active ? "Active" : "Disabled"}
            </td>

            </tr>
            `;
        }
    );
}

load();

</script>

</body>
</html>
