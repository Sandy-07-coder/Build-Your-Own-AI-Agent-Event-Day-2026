<!DOCTYPE html>
<html>
<head>
<title>Evaluations</title>
<link rel="stylesheet" href="/shared/style.css">
</head>

<body>

<nav>
<strong>ADMIN — EVALUATIONS</strong>
<a href="/admin/dashboard.html">
Dashboard
</a>
</nav>

<main>

<h1>Evaluation Results</h1>

<div id="results"></div>

</main>

<script>

async function load(){

    const data =
        await fetch(
            "/api/admin/evaluations"
        ).then(r=>r.json());

    const root =
        document.getElementById(
            "results"
        );

    root.innerHTML = "";

    data.forEach(
        x => {

            root.innerHTML += `
            <div class="card">

            <h2>
            ${x.team_name}
            —
            ${x.agent_name}
            </h2>

            <div class="grid">

            <div>
            Functionality:
            <strong>
            ${x.functionality}
            </strong>
            </div>

            <div>
            Quality:
            <strong>
            ${x.quality}
            </strong>
            </div>

            <div>
            Robustness:
            <strong>
            ${x.robustness}
            </strong>
            </div>

            <div>
            Final:
            <strong>
            ${x.final_score}
            </strong>
            </div>

            </div>

            </div>
            `;
        }
    );
}

load();

</script>

</body>
</html>
