<!DOCTYPE html>
<html>
<head>
<title>Submissions</title>
<link rel="stylesheet" href="/shared/style.css">
</head>

<body>

<nav>
<strong>ADMIN</strong>
<a href="/admin/dashboard.html">
Dashboard
</a>
</nav>

<main>

<h1>Submissions</h1>

<div class="card">

<table>

<thead>

<tr>
<th>ID</th>
<th>Team</th>
<th>Agent</th>
<th>Status</th>
<th>Score</th>
<th>Action</th>
</tr>

</thead>

<tbody id="data"></tbody>

</table>

</div>

</main>

<script>

async function load(){

    const data =
        await fetch(
            "/api/admin/submissions"
        ).then(r=>r.json());

    const tbody =
        document.getElementById(
            "data"
        );

    tbody.innerHTML = "";

    data.forEach(
        x => {

            tbody.innerHTML += `
            <tr>

            <td>${x.id}</td>

            <td>${x.team_name}</td>

            <td>${x.agent_name}</td>

            <td>${x.status}</td>

            <td>
            ${
                x.final_score === null
                ? "--"
                : x.final_score
            }
            </td>

            <td>

            <button
            onclick="evaluateAgent(${x.id})"
            >
            Evaluate
            </button>

            </td>

            </tr>
            `;

        }
    );
}


async function evaluateAgent(id){

    if(
        !confirm(
            "Run automated evaluation?"
        )
    ){
        return;
    }

    const response =
        await fetch(
            "/api/evaluations/run/" + id,
            {
                method:"POST"
            }
        );

    const data =
        await response.json();

    alert(
        "Final Score: " +
        data.final_score
    );

    load();
}

load();

</script>

</body>
</html>
